name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.os }} (${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          # macos-latest ships GNU Make 3.81 as `make`, which deliberately
          # exercises the compatibility floor.
          - os: macos-latest
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Run platform tests
        # Exercise environment-selected toolchains on every matrix row.
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -C tests host

  docker:
    name: docker (ubuntu 24.04 arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Run platform tests in docker
        run: make -C tests docker-arm64
